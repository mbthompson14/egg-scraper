name: Quarterly egg report

on:
  schedule:
    - cron: '0 6 1 1,4,7,10 *'   # 06:00 UTC on 1 Jan, 1 Apr, 1 Jul, 1 Oct
  workflow_dispatch:               # allow manual trigger

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests pandas pyyaml matplotlib numpy

      - run: python analysis/report.py --output analysis/report.md

      - name: Commit updated report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/report.md analysis/production_mix.png analysis/data.csv
          git diff --cached --quiet || git commit -m "chore: quarterly egg report $(date +%Y-%m-%d)"
          git push
